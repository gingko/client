name: Web Deploy

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: [ self-hosted, gingkowriter ]

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Setup bun
        uses: oven-sh/setup-bun@v1

      - name: Checkout
        uses: actions/checkout@v3

      - name: Create data directory
        run: mkdir -p data

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Copy client config.js file
        run: cp $HOME/client.config.js $GITHUB_WORKSPACE/client/config.js

      - name: Check client config.js file
        run: node $GITHUB_WORKSPACE/client/config-check.js

      - name: Copy client hidden-config.js file
        run: cp $HOME/client.hidden-config.js $GITHUB_WORKSPACE/client/hidden-config.js

      - name: Copy server config.js file
        run: cp $HOME/server.config.js $GITHUB_WORKSPACE/server/config.js

      - name: Check server config.js file
        run: node $GITHUB_WORKSPACE/server/config-check.js

      - name: Install Test Server Dependencies
        run: cd server; npm i; npx tsc

      - name: Install client dependencies
        working-directory: client
        run: bun i

      - name: Build client
        working-directory: client
        run: bun run newbuild

      # Playwright starts its own server per worker, each against a throwaway
      # copy of a committed SQLite fixture, so it needs no shared test server.
      - name: Playwright e2e Tests
        working-directory: client
        run: bun run test

      - name: Stop Test Server
        run: "pm2 stop --silent GingkoTest  || :"

      # Cypress still uses the older shared-server seeding. Started from the
      # server/ directory so its relative '../data/data.sqlite' and
      # '../client/web' paths resolve inside the workspace.
      - name: Start Test Server
        working-directory: server
        run: NODE_ENV=production DEBUG=cards PORT=8000 pm2 start dist/index.js --name GingkoTest

      - name: Cypress e2e Tests
        working-directory: client
        run: bunx cypress run

      - name: Stop Test Server
        run: pm2 stop GingkoTest

      - name: Maybe Migrate Database
        if: "contains(github.event.head_commit.message, 'db:migrate')"
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          cd $HOME/production/data

          echo "Backing up database..."
          COMMIT_HASH=${{ github.sha }}
          SHORT_COMMIT_HASH=${COMMIT_HASH:0:7}
          sqlite3 data.sqlite "VACUUM INTO 'backup-pre-$SHORT_COMMIT_HASH.sqlite'"

          echo "Migrating database..."
          PREFIX=$(echo "$COMMIT_MESSAGE" | grep -oP 'db:migrate:\K\w+')
          if [ -z "$PREFIX" ]; then
            echo "Commit message contains 'db:migrate' but no valid db:migrate:XXXX id was found - skipping migration"
            exit 1
          fi
          MIGRATION_FILE=$(ls $GITHUB_WORKSPACE/server/scripts/db/$PREFIX* | head -n 1)
          if [ -f "$MIGRATION_FILE" ]; then
            sqlite3 data.sqlite < "$MIGRATION_FILE"
            echo "Migration $MIGRATION_FILE has been applied"
          else
            echo "Migration file with prefix $PREFIX does not exist"
          exit 1
          fi

      - name: Copy Build Files
        if: "!contains(github.event.head_commit.message, 'ci skip deploy')"
        run: |
          cp -r $GITHUB_WORKSPACE/client/web/* $HOME/production/client/web
          cp -r $GITHUB_WORKSPACE/server/* $HOME/production/server

      - name: Restart Production Server
        if: "!contains(github.event.head_commit.message, 'ci skip deploy')"
        run: pm2 restart GingkoProductionNew
